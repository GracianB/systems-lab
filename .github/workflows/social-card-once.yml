name: One-time social image render
on:
  push:
    branches: ['feat/social-preview-2026']
    paths: ['.github/workflows/social-card-once.yml']
permissions:
  contents: write
jobs:
  rasterize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Render 1200x630 share image
        run: |
          python3 -m pip install --disable-pip-version-check cairosvg==2.8.2
          python3 - <<'PY'
          import struct
          from cairosvg import svg2png
          svg2png(url="og-cover.svg", write_to="og-cover.png", output_width=1200, output_height=630)
          with open("og-cover.png", "rb") as f:
              data=f.read(24)
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a")
          assert struct.unpack(">II", data[16:24]) == (1200,630)
          PY
      - name: Commit only the rendered PNG to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "og-cover.png"
          if ! git diff --cached --quiet; then
            git commit -m "assets: rasterize verified social preview"
            git push origin HEAD:feat/social-preview-2026
          fi
