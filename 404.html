<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — PLAY · Gracián Baena</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://gracianb.github.io/systems-lab/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#06070a; --ink:#f4f3ee; --muted:#9a9991; --ice:#7af3ff; --r:4px; --display:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      padding: 24px;
    }
    .card { max-width: 28rem; }
    .mark {
      display: grid; place-items: center;
      width: 42px; height: 42px;
      border: 1px solid var(--ice);
      border-radius: var(--r);
      color: var(--ice);
      font: 800 12px var(--mono);
      margin-bottom: 28px;
    }
    p.kicker {
      margin: 0 0 10px;
      color: var(--ice);
      font: 800 11px var(--mono);
      letter-spacing: .18em;
    }
    h1 {
      margin: 0 0 12px;
      font: 600 clamp(32px, 6vw, 44px)/1.05 var(--display);
      letter-spacing: -.03em;
    }
    p.lead { margin: 0 0 28px; color: var(--muted); line-height: 1.5; }
    a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      padding: 0 16px;
      background: var(--ice);
      color: #031016;
      font: 800 11px var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: var(--r);
    }
    :focus-visible { outline: 2px solid var(--ice); outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">PL</div>
    <p class="kicker">404</p>
    <h1>Esta ruta no existe.</h1>
    <p class="lead">PLAY vive en la raíz de systems-lab. Ohana, Vórtice y el Help Center están allí.</p>
    <a href="./index.html">Volver a PLAY →</a>
  </div>
</body>
</html>
