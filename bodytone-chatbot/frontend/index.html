<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Systems Lab · Agent demo</title><link rel="icon" href="../../favicon.svg"><link rel="stylesheet" href="demo.css?v=5"><script src="demo.js?v=5" defer></script>
</head>
<body>
<main class="chat">
<header><div><span class="dot" aria-hidden="true"></span><strong>Support agent</strong><small id="disclaimer">Simulación local · datos ficticios</small></div><button id="reset" type="button">Reiniciar</button></header>
<div id="messages" role="log" aria-live="polite" aria-label="Conversación"></div>
<div id="suggestions"><button type="button" data-intent="shipping">Envío</button><button type="button" data-intent="invoice">Factura</button><button type="button" data-intent="ticket">Ticket</button></div>
<form id="form"><label for="message" id="input-label">Tu consulta</label><div class="composer"><input id="message" maxlength="1000" autocomplete="off" required placeholder="¿Dónde está mi pedido?"><button type="submit" id="send">Enviar ↗</button></div><div class="attachments"><label for="files" id="files-label">Adjuntar archivos</label><input id="files" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.csv,.json"><small id="file-status" role="status"></small></div></form>
</main>
</body></html>
